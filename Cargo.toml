[package]
name = "heart-client"
version = "0.1.0"
edition = "2021"
description = "HTTP client for the Heart process engine API"
license = "MIT"
repository = "https://github.com/hbjoroy/ea-heart-client"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls", "dep:rustls", "dep:rustls-webpki", "dep:webpki-roots"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
# Preserve patched TLS versions in downstream Cargo resolutions as well as this lockfile.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
webpki-roots = { version = "1.0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
fastrand = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
